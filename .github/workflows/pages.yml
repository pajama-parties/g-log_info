name: Deploy Swagger UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@1.25.0 lint openapi.yaml --skip-rule=operation-4xx-response --skip-rule=operation-operationId --skip-rule=security-defined --skip-rule=no-server-example.com --skip-rule=info-license

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html openapi.yaml _site/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
